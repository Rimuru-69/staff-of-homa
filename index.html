<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff of Homa - 3D Viewer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    header {
      text-align: center;
      padding: 20px;
    }

    #viewer {
      width: 100%;
      height: 70vh;
      min-height: 400px;
      position: relative;
      overflow: hidden;
      background: #ffffff;
      cursor: grab;
      touch-action: none;
    }

    #viewer:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
    }

    .controls {
      text-align: center;
      padding: 16px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      background: #1769ff;
      color: white;
      cursor: pointer;
    }

    #status {
      text-align: center;
      font-size: 14px;
      padding: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Staff of Homa - Interactive 3D Product</h1>
    <p>Drag to rotate. Scroll or pinch to zoom.</p>
  </header>

  <div id="viewer"></div>
  <div id="status">Loading 3D product...</div>

  <div class="controls">
    <button id="reset">Reset View</button>
    <button id="rotate">Toggle Auto-Rotate</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    // 1. Create the scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#ffffff");

    // 2. Set up the camera
    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.1,
      100
    );

    camera.position.set(0, 1, 4);

    // 3. Create the WebGL renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    viewer.appendChild(renderer.domElement);

    // 4. Add lighting
    scene.add(new THREE.HemisphereLight(
      0xffffff, 0x666677, 2
    ));

    const light = new THREE.DirectionalLight(
      0xffffff, 3
    );
    light.position.set(3, 5, 5);
    scene.add(light);

    // 5. Enable mouse and touch controls (360 dragging)
    const controls = new OrbitControls(
      camera, renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 2;

    // 6. Load your custom 3D model
    const loader = new GLTFLoader();

    // Change "staff_of_homa.glb" to your direct hosted URL or local file path
    loader.load(
      "staff_of_homa.glb",

      function (gltf) {
        const product = gltf.scene;

        // Center the model around the origin
        const box = new THREE.Box3().setFromObject(product);
        const center = box.getCenter(new THREE.Vector3());
        product.position.sub(center);

        // Fit the model into the viewer automatically
        const size = box.getSize(new THREE.Vector3());
        const maxDimension = Math.max(size.x, size.y, size.z);

        if (maxDimension > 0) {
          product.scale.setScalar(2 / maxDimension);
        }

        scene.add(product);
        controls.target.set(0, 0, 0);
        controls.update();

        status.textContent = "Product loaded. Drag to inspect it.";
      },

      function (progress) {
        if (progress.total > 0) {
          const percent = Math.round((progress.loaded / progress.total) * 100);
          status.textContent = "Loading product: " + percent + "%";
        }
      },

      function (error) {
        console.error(error);
        status.textContent = "Unable to load model. Make sure you are running via a local server or using a valid web link.";
      }
    );

    // 7. Reset camera and rotation
    document.getElementById("reset").onclick = () => {
      camera.position.set(0, 1, 4);
      controls.target.set(0, 0, 0);
      controls.reset();
      controls.update();
    };

    // 8. Toggle automatic rotation
    document.getElementById("rotate").onclick = () => {
      controls.autoRotate = !controls.autoRotate;
    };

    // 9. Handle browser resizing
    window.addEventListener("resize", () => {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // 10. Render continuously
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
